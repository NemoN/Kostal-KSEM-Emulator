[project]
name = "kostal-ksem-emulator"
version = "0.1.0"
description = "KSEM RTU emulator with Shelly and Victron MQTT inputs"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
  "pymodbus==3.12.1",
  "pyserial==3.5",
  "httpx==0.28.1",
  "paho-mqtt==2.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
